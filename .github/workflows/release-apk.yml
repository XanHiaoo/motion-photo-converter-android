name: Release Android APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build Android web assets
        working-directory: web
        run: npm run build:android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || {
            echo "Missing GitHub Secret: ANDROID_RELEASE_KEYSTORE_BASE64"
            exit 1
          }
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks

      - name: Build release APK
        env:
          ANDROID_RELEASE_KEYSTORE: app/release-key.jks
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD" || { echo "Missing GitHub Secret: ANDROID_RELEASE_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_RELEASE_KEY_ALIAS" || { echo "Missing GitHub Secret: ANDROID_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_RELEASE_KEY_PASSWORD" || { echo "Missing GitHub Secret: ANDROID_RELEASE_KEY_PASSWORD"; exit 1; }
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "MotionPhotoConverter-${GITHUB_REF_NAME}.apk"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "MotionPhotoConverter-${GITHUB_REF_NAME}.apk" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "MotionPhotoConverter-${GITHUB_REF_NAME}.apk" \
              --verify-tag \
              --generate-notes \
              --title "Motion Photo Converter ${GITHUB_REF_NAME}"
          fi
