plugins {
    id 'com.android.application'
}

def keystoreProperties = new Properties()
def keystorePropertiesPath = System.getenv('ANDROID_KEYSTORE_PROPERTIES')
def keystorePropertiesFile = keystorePropertiesPath ? file(keystorePropertiesPath) : rootProject.file('keystore.properties')
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = project.file('keystore.properties')
}
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def releaseStoreFilePath = System.getenv('ANDROID_RELEASE_KEYSTORE') ?: keystoreProperties.getProperty('storeFile')
def releaseStorePassword = System.getenv('ANDROID_RELEASE_KEYSTORE_PASSWORD') ?: keystoreProperties.getProperty('storePassword')
def releaseKeyAlias = System.getenv('ANDROID_RELEASE_KEY_ALIAS') ?: keystoreProperties.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('ANDROID_RELEASE_KEY_PASSWORD') ?: keystoreProperties.getProperty('keyPassword')
def releaseStoreFile = releaseStoreFilePath ? file(releaseStoreFilePath) : null
if (releaseStoreFilePath && !new File(releaseStoreFilePath).isAbsolute() && keystorePropertiesFile.exists()) {
    releaseStoreFile = new File(keystorePropertiesFile.parentFile, releaseStoreFilePath)
}
def releaseSigningReady = releaseStoreFile?.exists() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.xanhiaoo.motionphotoconverter'
    compileSdk 36
    buildToolsVersion '36.0.0'

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.xanhiaoo.motionphotoconverter'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseBuildRequested = taskGraph.hasTask(':app:assembleRelease') || taskGraph.hasTask(':app:bundleRelease')
    if (releaseBuildRequested && !releaseSigningReady) {
        throw new GradleException('Release signing is not configured. Set ANDROID_KEYSTORE_PROPERTIES or ANDROID_RELEASE_* environment variables.')
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
}
